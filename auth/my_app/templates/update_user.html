{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<form method="POST" style="width: 50%; margin: auto;" novalidate>
    <h2 class="mt-3" >Update Your Profile </h2>
    {% csrf_token %}
    {{form | crispy }}
    <button type="submit" class="btn btn-primary my-2">Update User</button>
</form>
{% endblock %}
